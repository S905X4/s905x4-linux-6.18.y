%YAML 1.2
---
$id: http://devicetree.org/schemas/thermal/amlogic,thermal.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Amlogic Thermal

maintainers:
  - Guillaume La Roque <glaroque@baylibre.com>

description: |
  Amlogic R1P1 temperature sensors use a per-sensor calibrated trim word.
  SC2 exposes this word as a second MMIO resource in the system controller,
  rather than through the AO secure syscon used on G12A and A1. The CPU and
  DDR sensors share a 500 kHz functional clock but have independent trim
  words. SC2 calibration validity is checked before the thermal zone is
  registered; no uncalibrated temperature estimate is provided.
  The SC2 driver also programs the calibrated autonomous overtemperature
  reset at a nominal 110 degrees Celsius, including on resume. This uses
  the R1P1 rising-code quantization and does not replace the thermal zone's
  lower software critical trip or CPU cooling policy.

$ref: thermal-sensor.yaml#

properties:
  compatible:
    oneOf:
      - items:
          - enum:
              - amlogic,g12a-cpu-thermal
              - amlogic,g12a-ddr-thermal
          - const: amlogic,g12a-thermal
      - const: amlogic,a1-cpu-thermal
      - enum:
          - amlogic,sc2-cpu-thermal
          - amlogic,sc2-ddr-thermal

  reg:
    minItems: 1
    maxItems: 2

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  power-domains:
    maxItems: 1

  amlogic,ao-secure:
    description: phandle to the ao-secure syscon
    $ref: /schemas/types.yaml#/definitions/phandle

  '#thermal-sensor-cells':
    const: 0

required:
  - compatible
  - reg
  - interrupts
  - clocks

allOf:
  - if:
      properties:
        compatible:
          contains:
            enum:
              - amlogic,sc2-cpu-thermal
              - amlogic,sc2-ddr-thermal
    then:
      properties:
        reg:
          items:
            - description: Sensor registers
            - description: Calibrated trim word in the system controller
        amlogic,ao-secure: false
    else:
      properties:
        reg:
          maxItems: 1
      required:
        - amlogic,ao-secure

unevaluatedProperties: false

examples:
  - |
    temperature-sensor@ff634800 {
        compatible = "amlogic,g12a-cpu-thermal",
                     "amlogic,g12a-thermal";
        reg = <0xff634800 0x50>;
        interrupts = <0x0 0x24 0x0>;
        clocks = <&clk 164>;
        #thermal-sensor-cells = <0>;
        amlogic,ao-secure = <&sec_AO>;
    };
...
